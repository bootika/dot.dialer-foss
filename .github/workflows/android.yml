name: Android quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Keep internal documentation private
        shell: pwsh
        run: ./tools/check-private-documentation.ps1

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify foundation
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          (
            while true; do
              date -u
              free -m
              ps -eo pid,ppid,comm,rss --sort=-rss | sed -n '1,12p'
              sleep 15
            done
          ) > ci-diagnostics/runner-memory.log &
          memory_monitor=$!
          trap 'kill "$memory_monitor" 2>/dev/null || true' EXIT

          # One compiler JVM and one worker bound peak memory on private runners.
          # Finish compilation before starting Robolectric so compiler memory is released.
          ./gradlew --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process qualityGate -x :app:testFossDebugUnitTest :app:compileFossDebugUnitTestKotlin
          ./gradlew --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process :app:testFossDebugUnitTest

      - name: Verify store dependency graphs
        run: ./gradlew --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process :app:testGplayDebugUnitTest --tests '*AppModuleResolutionTest' :app:testRustoreDebugUnitTest --tests '*AppModuleResolutionTest'

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-quality-reports
          if-no-files-found: ignore
          path: |
            ci-diagnostics/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            core/diagnostics/build/reports/tests/
            core/diagnostics/build/test-results/
            core/domain/build/reports/tests/
            core/domain/build/test-results/

      - name: Upload installable test APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: dot-dialer-test-apk
          if-no-files-found: error
          path: app/build/outputs/apk/foss/debug/*.apk
