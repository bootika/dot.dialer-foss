name: Android quality gate

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Fast checks
    if: ${{ github.event.repository.private && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Keep internal documentation private
        shell: pwsh
        run: ./tools/check-private-documentation.ps1

      - name: Check private admin source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d backend/src && -d backend/public ]]; then
            find backend/src backend/public -name '*.php' -print0 | xargs -0 -n 1 php -l
            for script in backend/public/*.js; do node --check "$script"; done
            node --test backend/admin-actions-tests.cjs backend/shared-admin-tests.cjs backend/desk-ui-tests.cjs
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify architecture and core logic
        run: timeout --kill-after=30s 8m ./gradlew --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process architectureCheck sourceSizeRatchet legacySmellRatchet :core:domain:test :core:diagnostics:test

      - name: Upload core reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-check-reports
          if-no-files-found: ignore
          path: |
            core/diagnostics/build/test-results/
            core/domain/build/test-results/

  verify:
    name: Full Android quality gate
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Keep internal documentation private
        shell: pwsh
        run: ./tools/check-private-documentation.ps1

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify uncached Robolectric runtime
        run: timeout --kill-after=30s 15m ./gradlew --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process :app:testFossDebugUnitTest --tests '*AppModuleResolutionTest' --tests '*PlanGuideRenderingTest' --tests '*CallConferenceMistRenderingTest' --tests '*VoiceSearchRenderingTest'

      - name: Verify foundation
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          (
            while true; do
              date -u
              free -m
              free -m | awk '/^Mem:/ {print "Runner memory MiB: total=" $2 ", used=" $3 ", available=" $7 > "/dev/stderr"}'
              ps -eo pid,ppid,comm,rss --sort=-rss | sed -n '1,12p'
              sleep 15
            done
          ) > ci-diagnostics/runner-memory.log &
          memory_monitor=$!
          trap 'kill "$memory_monitor" 2>/dev/null || true' EXIT

          # Bound each phase to one JVM/worker and release compiler memory before lint,
          # R8 and Robolectric. The final unfiltered gate still enforces every check.
          timeout --kill-after=30s 15m ./gradlew --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process :app:compileFossDebugKotlin :app:compileGplayDebugKotlin :app:compileRustoreDebugKotlin :app:compileFossDebugAndroidTestKotlin :app:compileFossDebugUnitTestKotlin
          timeout --kill-after=30s 15m ./gradlew --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process :app:lintFossDebug
          # Finish debug packaging and release compilation before the independent R8/lint budget.
          timeout --kill-after=30s 15m ./gradlew --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process :app:assembleFossDebug :app:compileFossReleaseKotlin :app:compileFossReleaseJavaWithJavac
          timeout --kill-after=30s 15m ./gradlew --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process :app:assembleFossRelease
          timeout --kill-after=30s 15m ./gradlew --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process qualityGate

      - name: Verify store dependency graphs
        run: timeout --kill-after=30s 15m ./gradlew --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process :app:testGplayDebugUnitTest --tests '*AppModuleResolutionTest' :app:testRustoreDebugUnitTest --tests '*AppModuleResolutionTest'

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-quality-reports
          if-no-files-found: ignore
          path: |
            ci-diagnostics/
            app/build/reports/tests/
            app/build/reports/visual/
            app/build/test-results/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            core/diagnostics/build/reports/tests/
            core/diagnostics/build/test-results/
            core/domain/build/reports/tests/
            core/domain/build/test-results/

      - name: Upload installable test APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: dot-dialer-test-apk
          if-no-files-found: error
          path: app/build/outputs/apk/foss/debug/*.apk
